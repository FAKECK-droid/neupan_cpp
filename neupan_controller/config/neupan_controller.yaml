# Scout Mini profile: merge both sections into your existing Nav2 params file.
# Start neupan_controller/neupan_controller_server instead of the standard executable.
# planner_server and its global_costmap remain configured by your navigation stack.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: neupan_controller::NeupanController
      # Runtime tuning is supported; see README for the full list.
      # Initialization only: points_topic, dune_checkpoint, receding, step_time,
      # ipath.interval and pan.nrmp_max_num (cleanup/configure to change).
      points_topic: points
      pointcloud_timeout: 2.0
      # Height and XY range in robot_base_frame at the cloud's timestamp.
      min_obstacle_height: 0.05
      max_obstacle_height: 1.5
      min_obstacle_range: 0.0
      # Keep current points plus the 1 s horizon inside the model training range +/-5 m.
      max_obstacle_range: 3.5
      # Relative to this package's installed share directory on both WSL and Jetson.
      dune_checkpoint: /home/yan/ros2_ws/src/neupan_cpp/neupan_controller/models/scout_mini_waffle/scout_mini.bin
      receding: 10
      # A 1 s horizon at the same QP size; control still updates at 20 Hz.
      step_time: 0.1
      ref_speed: 0.5
      max_speed: [0.8, 1.0]   # [m/s, rad/s]
      max_acce: [1.0, 2.0]    # [m/s^2, rad/s^2]
      collision_threshold: 0.1
      rotate_to_goal_gain: 2.0
      ipath:
        interval: 0.05
        close_threshold: 0.1
        ind_range: 10
      pan:
        iter_num: 2
        dune_max_num: 100
        nrmp_max_num: 10
        iter_threshold: 0.1
      adjust:
        q_s: [1.0, 1.0, 1.0]
        # Favor forward progress over pursuing an unnecessarily large clearance.
        p_u: 2.0
        eta: 1.0
        d_max: 0.3
        d_min: 0.1
        ro_obs: 400.0
        bk: 0.1

# Humble controller_server creates this node even for a map-free controller.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      # The thin server entry point sets plugins/filters to typed empty arrays.
      # Do not put [] here: Humble may reject untyped empty YAML arrays.
      # EXACT training vertices/order for the bundled Scout model (0.627 x 0.549 m).
      footprint: "[[0.3135, 0.2745], [-0.3135, 0.2745], [-0.3135, -0.2745], [0.3135, -0.2745]]"
      footprint_padding: 0.0
