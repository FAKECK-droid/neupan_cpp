# Upstream NeuPAN DUNETrain configuration. Network optimization runs on CUDA;
# distance/dual labels are generated by upstream CVXPY + ECOS on the CPU.
device: cuda:0
seed: 7

robot:
  name: scout_mini_waffle
  kinematics: diff
  # CCW bounding rectangle in base_link, shared with BOTH Nav2 costmaps by launch.
  # Official Waffle URDF: body 0.266 x 0.266, centered at x=-0.064 m.
  # Official Gazebo SDF: body 0.265 x 0.265; camera front reaches x=0.073 m.
  # Wheels: centers y=+/-0.144, tire width 0.018 -> outer y=+/-0.153 m.
  # Round outward to x=[-0.200, 0.075], y=[-0.155, 0.155] (0.275 x 0.310 m).
  # Explicit vertices preserve the rearward body offset from the drive axle.
  vertices:
    - [0.3135, 0.2745]
    - [-0.3135, 0.2745]
    - [-0.3135, -0.2745]
    - [0.3135, -0.2745]
  # Match the official Humble Nav2 demo and its velocity_smoother limits.
  max_speed: [0.26, 1.0]
  max_acce: [2.5, 3.2]

train:
  data_size: 100000
  # Covers the 3.5 m lidar range plus the 1 s prediction horizon.
  data_range: [-5.0, -5.0, 5.0, 5.0]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5.0e-5
  lr_decay: 0.5
  decay_freq: 1500
